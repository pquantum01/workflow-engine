version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    volumes:
      - pgdata_full:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://workflow:workflow@postgres:5432/workflow?sslmode=disable
      LOG_LEVEL: info
      LOG_FORMAT: json
      HTTP_ADDR: ":8080"
      WORKFLOWS_DIR: /workflows
      WEBHOOK_CONFIG: /run/config/webhooks.json
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./webhooks.json:/run/config/webhooks.json:ro

volumes:
  pgdata_full:
