version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_test
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  pgdata_test:
